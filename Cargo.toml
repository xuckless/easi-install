[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
easi-core = { path = "crates/easi-core" }
easi-cli = { path = "crates/easi-cli" }
easi-gui = { path = "crates/easi-gui" }
# clap: subcommand parsing + help for the CLI view.
clap = { version = "4.6", features = ["derive"] }
# slint: GUI toolkit (project requirement).
slint = "1.19"
slint-build = "1.19"
# thiserror: typed error enums (AGENTS.md requirement).
thiserror = "2"
# serde + toml: manifest & saved-handler config persistence.
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# sha2: SHA-256 digest for trust summary.
sha2 = "0.10"
# tar + compression crates: streaming archive inspection & safe extraction without shelling out.
tar = "0.4"
flate2 = "1"
xz2 = "0.1"
zstd = "0.13"
bzip2 = "0.5"
# zip: pure-Rust zip inspection & safe extraction.
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "zstd"] }
# sevenz-rust: pure-Rust .7z inspection & safe extraction.
sevenz-rust = "0.6"
# backhand: pure-Rust SquashFS reader for AppImage type 2 without executing untrusted files.
backhand = "0.21"
# tempfile: fresh temp dirs for untrusted extraction and temp-root tests.
tempfile = "3"
# xattr: read user.xdg.origin.url extended attribute for trust summary.
xattr = "1"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
