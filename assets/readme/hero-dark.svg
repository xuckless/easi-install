<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img"><title>Dragging the Notes AppImage into the Applications folder installs it</title><style>@font-face{font-family:'Geist easi';font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Geist easi';font-weight:500;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Geist easi';font-weight:600;src:url(data:font/woff;base64,) format('woff')}text{font-family:'Geist easi',Geist,system-ui,sans-serif;white-space:pre}
.box{animation:box 6s infinite;transform-box:view-box}
@keyframes box{0%,14%{transform:translate(0,0) scale(1);opacity:1;animation-timing-function:cubic-bezier(.22,1,.36,1)}
 20%{transform:translate(0,-8px) scale(1.06)}
 52%{transform:translate(480px,-6px) scale(1.06);opacity:1;animation-timing-function:cubic-bezier(.55,0,1,.45)}
 60%{transform:translate(480px,18px) scale(.45);opacity:0}
 90%{transform:translate(480px,18px) scale(.45);opacity:0}
 91%{transform:translate(0,0) scale(.9);opacity:0}
 100%{transform:translate(0,0) scale(1);opacity:1}}
.cursor{animation:cur 6s infinite}
@keyframes cur{0%,6%{opacity:0;transform:translate(46px,40px)}12%,54%{opacity:1;transform:translate(18px,16px)}58%,100%{opacity:0;transform:translate(18px,16px)}}
.ghost{animation:ghost 6s infinite}
@keyframes ghost{0%,18%{opacity:0}24%,88%{opacity:1}96%,100%{opacity:0}}
.dash{animation:dash 6s infinite}
@keyframes dash{0%,22%{opacity:0}30%,56%{opacity:1}62%,100%{opacity:0}}
.folder{animation:fold 6s infinite;transform-origin:720px 176px}
@keyframes fold{0%,58%{transform:scale(1)}63%{transform:scale(1.06)}70%,100%{transform:scale(1)}}
.chev path{animation:chev 6s infinite}
.c2{animation-delay:.08s!important}.c3{animation-delay:.16s!important}.c4{animation-delay:.24s!important}
@keyframes chev{0%,22%{opacity:.35}30%{opacity:1}38%,100%{opacity:.35}}
.sa{animation:sa 6s infinite}.sb{animation:sb 6s infinite}
@keyframes sa{0%,58%{opacity:1}62%,92%{opacity:0}97%,100%{opacity:1}}
@keyframes sb{0%,60%{opacity:0;transform:translateY(6px)}66%,90%{opacity:1;transform:translateY(0)}94%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
