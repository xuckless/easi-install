<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 340" width="470" height="340" role="img"><title>Terminal session: easi install asks Install? [Y/n], shows progress, then moves the download to Trash</title><style>@font-face{font-family:'Geist easi';font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Geist easi';font-weight:500;src:url(data:font/woff;base64,) format('woff')}text{font-family:'Geist easi',Geist,system-ui,sans-serif;white-space:pre}
.tc{animation:tc 8s infinite steps(31,end);transform-box:fill-box;transform-origin:left center}
@keyframes tc{0%,3%{transform:scaleX(0)}18%,92%{transform:scaleX(1)}96%,100%{transform:scaleX(0)}}
.caret{animation:car 8s infinite steps(31,end)}
@keyframes car{0%,3%{transform:translateX(0);opacity:1}18%{transform:translateX(178.5px);opacity:1}19%,100%{transform:translateX(178.5px);opacity:0}}
.l,.p{animation-duration:8s;animation-iteration-count:infinite;opacity:0}
.l0{animation-name:l0}@keyframes l0{0%,22%{opacity:0}23%,92%{opacity:1}96%,100%{opacity:0}}.l1{animation-name:l1}@keyframes l1{0%,23%{opacity:0}24%,92%{opacity:1}96%,100%{opacity:0}}.l2{animation-name:l2}@keyframes l2{0%,24%{opacity:0}25%,92%{opacity:1}96%,100%{opacity:0}}.l3{animation-name:l3}@keyframes l3{0%,30%{opacity:0}31%,92%{opacity:1}96%,100%{opacity:0}}.l5{animation-name:l5}@keyframes l5{0%,60%{opacity:0}61%,92%{opacity:1}96%,100%{opacity:0}}.l6{animation-name:l6}@keyframes l6{0%,66%{opacity:0}67%,92%{opacity:1}96%,100%{opacity:0}}.l7{animation-name:l7}@keyframes l7{0%,74%{opacity:0}75%,92%{opacity:1}96%,100%{opacity:0}}.p0{animation-name:p0}@keyframes p0{0%,38%{opacity:0}38.5%,44%{opacity:1}44.5%,100%{opacity:0}}.p1{animation-name:p1}@keyframes p1{0%,44%{opacity:0}44.5%,50%{opacity:1}50.5%,100%{opacity:0}}.p2{animation-name:p2}@keyframes p2{0%,50%{opacity:0}50.5%,55%{opacity:1}55.5%,100%{opacity:0}}.p3{animation-name:p3}@keyframes p3{0%,55%{opacity:0}55.5%,92%{opacity:1}92.5%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
