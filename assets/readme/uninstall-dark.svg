<g class="it i0"><circle cx="58" cy="115" r="3" fill="#6F727C"/><text x="72" y="120" font-size="14" font-weight="400" fill="#A3A6AF" text-anchor="start">~/Applications/Notes</text>
<rect x="70" y="114" width="146.184" height="1.6" fill="#A3A6AF" class="strike"/></g><g class="it i1"><circle cx="58" cy="144" r="3" fill="#6F727C"/><text x="72" y="149" font-size="14" font-weight="400" fill="#A3A6AF" text-anchor="start">App menu entry</text>
<rect x="70" y="143" width="107.992" height="1.6" fill="#A3A6AF" class="strike"/></g><g class="it i2"><circle cx="58" cy="173" r="3" fill="#6F727C"/><text x="72" y="178" font-size="14" font-weight="400" fill="#A3A6AF" text-anchor="start">Icon</text>
