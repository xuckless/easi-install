<text x="92" y="60" font-size="16" font-weight="600" fill="#ECEDF0" text-anchor="start">Notes</text><text x="92" y="78" font-size="13" font-weight="400" fill="#6F727C" text-anchor="start">1.4.2  ·  GUI</text>
