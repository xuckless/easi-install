<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 340" width="470" height="340" role="img"><title>Uninstalling Notes removes its folder, menu entry, icon, command link and install record</title><style>@font-face{font-family:'Geist easi';font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Geist easi';font-weight:500;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Geist easi';font-weight:600;src:url(data:font/woff;base64,) format('woff')}text{font-family:'Geist easi',Geist,system-ui,sans-serif;white-space:pre}
.btn{animation:btn 6s infinite;transform-box:fill-box;transform-origin:center}
@keyframes btn{0%,10%{transform:scale(1)}12%{transform:scale(.97)}14%,100%{transform:scale(1)}}
.it{animation:it 6s infinite}
.strike{animation:st 6s infinite;transform-box:fill-box;transform-origin:left center}
.i1,.i1 .strike{animation-delay:.35s}.i2,.i2 .strike{animation-delay:.7s}.i3,.i3 .strike{animation-delay:1.05s}.i4,.i4 .strike{animation-delay:1.4s}
@keyframes it{0%,19%{opacity:1}24%,86%{opacity:.4}92%,100%{opacity:1}}
@keyframes st{0%,16%{transform:scaleX(0)}21%,86%{transform:scaleX(1)}92%,100%{transform:scaleX(0)}}
.done{animation:done 6s infinite}
@keyframes done{0%,56%{opacity:0;transform:translateY(4px)}62%,86%{opacity:1;transform:translateY(0)}92%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
