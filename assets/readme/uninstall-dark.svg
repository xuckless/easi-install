<rect x="70" y="201" width="98.388" height="1.6" fill="#A3A6AF" class="strike"/></g><g class="it i4"><circle cx="58" cy="231" r="3" fill="#6F727C"/><text x="72" y="236" font-size="14" font-weight="400" fill="#A3A6AF" text-anchor="start">Install record</text>
